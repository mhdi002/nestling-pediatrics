# Memory system configuration (assistant/memory/).
#
# Four kinds of memory, kept apart because they answer different questions:
#
#   procedural  how the assistant should behave
#   semantic    durable facts about a child or parent, stored as a graph
#   episodic    what was actually said
#   working     the current turn's retrieved care notes
#
# Nothing here is logic. Behaviour rules are text, budget shares are numbers,
# and the graph vocabulary is a list. All of it is editable without code.

version: 1

# ---------------------------------------------------------------------------
# Backend for semantic + episodic memory.
#
# `native` needs no network, no graph server and no embedding model. That is
# why it is the only one: this project deploys to hosts that have blocked
# huggingface.co, pypi.org and deb.debian.org, and a memory layer that stops
# working when a download fails is worse than a simpler one that always works.
# The profile graph below rides on this same store, so semantic memory is a
# graph without needing a graph database at all.
# ---------------------------------------------------------------------------
backends:
  native:
    driver: native

# ---------------------------------------------------------------------------
# Procedural memory: how the assistant should act.
#
# House rules, carried into every turn within their budget. They are here
# rather than in a prompt string so they can be corrected without a code
# change -- and because several exist only because a parent told us we were
# getting it wrong.
#
# `id` is stable (it is how a rule is overridden), `priority` orders them when
# the budget cannot hold all, and `applies_to` narrows a rule to turns of a
# given kind. Empty `applies_to` means always.
# ---------------------------------------------------------------------------
procedural:
  - id: use_memory_silently
    priority: 100
    applies_to: []
    text: >-
      Use what you remember without talking about it. Never mention notes,
      records or what you have or have not been told, and never re-answer an
      earlier turn. Once you have answered, stop -- do not add what else you
      do not know or have no record of.
    # Added after: "the agent is repeating the follow up in the next response".
    # The last sentence came later: asked which clinic, the deployed model
    # answered correctly and then volunteered "I don't have details about any
    # other specific clinic trips in our records", which is the same habit
    # arriving after the answer instead of instead of it.

  - id: never_reask_known
    priority: 95
    applies_to: []
    text: >-
      Do not ask for anything the parent has already given, in this
      conversation or an earlier one.
    # Added after the assistant asked for an age one message after it was told.

  - id: answer_the_question_asked
    priority: 90
    applies_to: []
    text: >-
      Answer only the topic of the current question. Never substitute a
      neighbouring topic that happens to share words with it.
    # Added after "where was her ulcer?" was answered about vaccination sites.

  - id: child_facts_beat_guidance
    priority: 85
    applies_to: [medical]
    text: >-
      A question about this particular child is answered from what the parent
      told you. General guidance is for what to do next, not for what is true
      about this child.

  - id: age_comes_from_the_record
    priority: 80
    applies_to: [medical, growth]
    text: >-
      Use only the child's recorded age. Never infer an age from the title of
      a guidance note.
    # Added after a section heading "Feeding 7-9 months" became the child's age.

  - id: no_diagnosis
    priority: 75
    applies_to: []
    text: >-
      Never diagnose and never invent a drug dose. Say plainly when something
      needs a clinician.

  - id: describe_what_you_see
    priority: 70
    applies_to: [vision]
    text: >-
      When the parent sends a photo, describe what is actually visible before
      anything else, and do not list what you cannot tell from it.
    # Added after a photo turn replied only with what it could not know.

# ---------------------------------------------------------------------------
# Consolidation: which turns are worth distilling into durable facts.
#
# Selection is by intent, matching the existing child-memory policy, because
# small talk and slot corrections would drown the store within a few sessions.
# ---------------------------------------------------------------------------
consolidation:
  from_intents: [medical, screening, growth_analysis, growth, vision]
  # A distilled fact shorter than this is not a fact, it is a fragment.
  min_fact_chars: 12
  # Facts per pass. The point is a durable record, not a transcript.
  max_facts_per_pass: 6

# ---------------------------------------------------------------------------
# The profile graph (assistant/memory/graph.py).
#
# Semantic memory is stored as entities and relationships, not only lines of
# text, so the agent can walk
#     child -> has_condition -> ulcer -> located_at -> stomach
#     child -> seen_at -> Mehr hospital
# instead of hoping two words share a sentence.
#
# Deliberately NOT Microsoft GraphRAG. That is a batch pipeline over a static
# corpus: indexing is dominated by LLM calls, runs to tens of dollars per
# million tokens, and Microsoft describe the project as in maintenance mode. A
# profile graph is the opposite shape -- a few dozen nodes per child, changing
# slightly each turn -- so it is built incrementally, on the extraction call
# consolidation was already making, and costs nothing extra per turn.
#
# `relations` and `entity_types` are a starting vocabulary shown to the model,
# NOT a whitelist: an extraction proposing something outside them is still
# stored, because a parent will describe something nobody listed in advance.
#
# NOTE ON QUOTING: the patterns below are single-quoted. YAML processes
# backslash escapes inside double quotes, which silently turned \b into a
# backspace byte and made this file unparseable. Single quotes are literal,
# which is what a regex needs.
# ---------------------------------------------------------------------------
graph:
  enabled: true
  # How far to walk from the entities a question mentions. Two hops is what
  # connects a condition to the clinic that treated it; three reaches
  # everything on a graph this small and stops being a filter.
  hops: 2

  entity_types:
    - child
    - condition
    - symptom
    - body_part
    - allergen
    - medication
    - clinic
    - clinician
    - food
    - milestone

  relations:
    - has_condition
    - has_symptom
    - located_at
    - allergic_to
    - takes
    - seen_at
    - seen_by
    - diagnosed_with
    - eats
    - avoids
    - reached_milestone
    - resolved

  # Fallback extraction for when the sidecar is down or the model returns
  # nothing usable -- which matters because this project serves a 4B model
  # whose structured output its own vendor calls unreliable. The last capture
  # group is the entity; `relation` names the edge it produces.
  patterns:
    - match: '(?:is |are )?allergic to ([a-z][a-z ''-]{2,40})'
      relation: allergic_to
      dst_type: allergen
    # Grammar, not a list of conditions. This used to enumerate
    # ulcer|rash|eczema|fever|cough|infection|allergy|asthma, so a parent
    # saying bronchiolitis, colic, reflux, croup or thrush produced no node at
    # all and the graph had nothing to walk from -- twenty-five generated
    # scenarios failed on exactly that. Capturing the noun phrase after the
    # verb and stopping at a preposition or clause boundary needs no
    # vocabulary and caught all twenty-five with no false positives on
    # ordinary chat.
    # The article group requires trailing whitespace: written "(?:an?|some|the )?"
    # the "an?" branch matched just the "a" of "an ulcer" and the condition was
    # recorded as "n ulcer".
    - match: '\b(?:has|had|got|developed)\s+(?:(?:an?|some|the)\s+)?([a-z][a-z''-]*(?:\s+[a-z''-]+){0,3}?)(?=\s+(?:on|in|at|since|for|and|but|which|that|from|after|before|when|because|last|this|next|yesterday|today|tonight|again|now)\b|[.,;!?]|$)'
      relation: has_condition
      dst_type: condition
    # Case-sensitive: the capitals are how the clinic's name is told apart
    # from the words around it. Matched case-insensitively, [A-Z] also matches
    # lowercase and this captured "a doctor at Mehr hospital" as the clinic.
    - match: '(?:saw|seen|visited|went to|treated at)[^.]{0,40}?((?:[A-Z][A-Za-z''-]*\s+)*(?:[Hh]ospital|[Cc]linic|[Hh]ealth [Cc]ent(?:er|re)))'
      relation: seen_at
      dst_type: clinic
      ignore_case: false
    # "on" only after a form of "be". Left bare it read "a rash ON his back"
    # as a medication and recorded "his back" as a drug.
    - match: '\b(?:(?:is|are|was|were)\s+(?:taking|on)|taking|given|prescribed|started on)\s+([a-z][a-z ''-]{2,40})'
      relation: takes
      dst_type: medication

    # The general case, and the reason the four above are a convenience rather
    # than the whole vocabulary. `relation_group` takes the edge label from the
    # verb the parent actually used, so the graph learns relations nobody wrote
    # down: "started crawling", "refuses vegetables", "was born at", "is afraid
    # of". Before this, eight of nine ordinary parent statements produced no
    # node at all, because only "has X" had a rule.
    #
    # Listed last: the specific patterns above give better-typed edges
    # (allergic_to, seen_at) and should win where they apply.
    - match: '\b(?:she|he|they|my\s+(?:son|daughter|baby|child|kid)|the\s+(?:baby|child))\s+((?:is|are|was|were)\s+[a-z]+(?:\s+(?:to|of|at|about))?|[a-z]+(?:s|ed|ing)?)\s+(?:(?:an?|the|some|his|her)\s+)?([\w''’-]+(?:\s+[\w''’-]+){0,3}?)(?=\s+(?:on|in|at|since|for|and|but|because|when|which|that|last|this|next|yesterday|today|tonight|again|now|every|from|with)\b|[.,;!?]|$)'
      relation_group: 1
      dst_group: 2
      dst_type: entity
      fallback: true
